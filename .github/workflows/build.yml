name: Rust build

on:
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Show all directories
        run: |
          echo "=== LIST OF ALL DIRECTORIES ==="
          find . -maxdepth 2 -type d
          echo "==============================="
