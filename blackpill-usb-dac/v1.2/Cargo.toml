[package]
edition = "2024"
name = "blackpill-1_2-usb-dac"
version = "0.1.0"
license = "GPL-3.0"

[dependencies]
audio = { path = "../../audio" }
blackpill-common = { path = "../common" }
embassy-stm32 = { version = "0.5.0", features = [
    "defmt",
    "stm32f401cc",
    "unstable-pac",
    "memory-x",
    "time-driver-tim1",
    "exti",
    "chrono",
] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-executor = { version = "0.9.1", features = [
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5.0", features = ["defmt", "tick-hz-32_768"] }
embassy-usb = { version = "0.5.1", features = ["defmt"] }
embassy-futures = "0.1.2"
embassy-embedded-hal = "0.5.0"

defmt = "1"
defmt-rtt = "1"

cortex-m = { version = "0.7", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7"
panic-probe = { version = "1", features = ["print-defmt"] }
heapless = { version = "0.9.2", default-features = false }
critical-section = "1.2"
static_cell = "2.1.1"
chrono = { version = "0.4.44", default-features = false }
grounded = "0.2.1"
static_assertions = "1"
micromath = "2.1.0"

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 3           # <-
overflow-checks = true  # <-

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 3           # <-
overflow-checks = true  # <-

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = 3            # <-
overflow-checks = false  # <-

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = 3            # <-
overflow-checks = false  # <-
