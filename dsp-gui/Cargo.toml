[package]
name = "dsp-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
dsp-protocol = { path = "../dsp-protocol", features = ["use-std"] }
colog = "1.3.0"
eframe = "0.31.1"
egui_plot = "0.31.0"
log = "0.4.26"
postcard = "1.1.1"
serde = "1.0.219"
tokio = { version = "1.44.1", features = ["full"] }
tokio-serial = "5.4.5"
postcard-rpc = { version = "0.11.8", features = ["use-std", "raw-nusb"] }
