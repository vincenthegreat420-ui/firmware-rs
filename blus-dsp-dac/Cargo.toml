[package]
edition = "2021"
name = "blus-dsp-dac"
version = "0.1.0"
license = "GPL-3.0"

[dependencies]
audio = { path = "../audio" }
embassy-stm32 = { path = "../embassy/embassy-stm32", features = [
    "defmt",
    "time-driver-any",
    "stm32g431cb",
    "memory-x",
    "unstable-pac",
    "exti",
] }
embassy-sync = { path = "../embassy/embassy-sync", features = ["defmt"] }
embassy-executor = { path = "../embassy/embassy-executor", features = [
    "arch-cortex-m",
    "executor-thread",
    "defmt",
    "task-arena-size-8192",
] }
embassy-time = { path = "../embassy/embassy-time", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
] }
embassy-usb = { path = "../embassy/embassy-usb", features = ["defmt"] }
embassy-futures = { path = "../embassy/embassy-futures" }
usbd-hid = "0.8.1"

defmt = "0.3"
defmt-rtt = "0.4"

critical-section = "1.2"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
embedded-hal = "1"
panic-probe = { version = "0.3", features = ["print-defmt"] }
heapless = { version = "0.8", default-features = false }
static_cell = "2"
micromath = "2.1.0"

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
lto = true
opt-level = 3
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
